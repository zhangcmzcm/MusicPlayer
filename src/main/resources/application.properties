spring.application.name=music

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.database=${REDIS_DATABASE}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}

app.mail.from=${MAIL_FROM}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.audience=${JWT_AUDIENCE}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS}

app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin-bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.storage.endpoint=${S3_ENDPOINT}
app.storage.region=${S3_REGION}
app.storage.access-key=${S3_ACCESS_KEY}
app.storage.secret-key=${S3_SECRET_KEY}
app.storage.audio-bucket=${S3_AUDIO_BUCKET}
app.storage.covers-bucket=${S3_COVERS_BUCKET}
app.storage.connect-timeout=${S3_CONNECT_TIMEOUT:2s}
app.storage.read-timeout=${S3_READ_TIMEOUT:30s}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_AUDIO_BYTES:209715200}B
spring.servlet.multipart.max-request-size=205MB
spring.servlet.multipart.file-size-threshold=0

app.track-import.temp-dir=${IMPORT_TEMP_DIR:${java.io.tmpdir}/music-imports}
app.track-import.audio-max-bytes=${UPLOAD_MAX_AUDIO_BYTES:209715200}
app.track-import.cover-max-bytes=${UPLOAD_MAX_COVER_BYTES:20971520}
app.track-import.rate-limit-per-minute=10