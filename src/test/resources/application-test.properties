spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=test@example.com

app.jwt.secret=test-secret-that-is-long-enough-1234567890
app.jwt.issuer=music-api
app.jwt.audience=music-client
app.jwt.ttl-seconds=86400

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.storage.endpoint=http://localhost:9000
app.storage.region=us-east-1
app.storage.access-key=test-access-key
app.storage.secret-key=test-secret-key
app.storage.audio-bucket=music-audio-test
app.storage.covers-bucket=music-covers-test
app.storage.connect-timeout=2s
app.storage.read-timeout=30s

app.admin-bootstrap.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.username=default
spring.data.redis.password=
spring.data.redis.timeout=2s
